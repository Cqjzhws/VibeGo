name: Build VibeGo

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4

    - name: Setup tools
      run: |
        brew install zig
        pip3 install --quiet lief

    - name: Download iPhoneOS SDK
      run: |
        curl -sL -o /tmp/sdk.tgz https://github.com/zhuowei/XcodeStuff/raw/main/iPhoneOS16.5.sdk.tar.gz || \
        curl -sL -o /tmp/sdk.tgz https://go.dev/dl/iPhoneOS16.5.sdk.tar.gz
        mkdir -p ~/sdk && tar xzf /tmp/sdk.tgz -C ~/sdk
        echo "SDK files:" && ls ~/sdk/

    - name: Build IPA
      run: |
        export IPHONEOS_SDK=$(find ~/sdk -maxdepth 3 -name "iPhoneOS*.sdk" -type d | head -1)
        echo "Using SDK: $IPHONEOS_SDK"
        cd vibego
        python3 build.py
        ls -la VibeGo*.ipa
        shasum -a 256 VibeGo*.ipa || true

    - uses: actions/upload-artifact@v4
      with:
        name: vibego-ipa
        path: vibego/VibeGo*.ipa
        if-no-files-found: error
