name: Build VibeGo

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 40

    steps:
    - uses: actions/checkout@v4

    - name: Install Python deps + verify clang
      run: |
        pip3 install lief --break-system-packages --quiet
        python3 -c "import lief; print('lief OK')"
        xcrun --sdk iphoneos clang --version | head -1

    - name: Build IPA
      run: |
        export IPHONEOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
        echo "SDK=$IPHONEOS_SDK"
        python3 build.py
        ls -la VibeGo*.ipa

    - uses: actions/upload-artifact@v4
      with:
        name: vibego-ipa
        path: VibeGo*.ipa
        if-no-files-found: error
