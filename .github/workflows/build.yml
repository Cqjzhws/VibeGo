name: Build VibeGo

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 40

    steps:
    - uses: actions/checkout@v4

    - name: Install zig + ziglang
      run: |
        ZIG_VER="0.14.0"
        curl -sL -o /tmp/zig.tar.xz "https://ziglang.org/download/${ZIG_VER}/zig-macos-aarch64-${ZIG_VER}.tar.xz" || \
          curl -sL -o /tmp/zig.tar.xz "https://ziglang.org/download/${ZIG_VER}/zig-macos-x86_64-${ZIG_VER}.tar.xz"
        tar xJf /tmp/zig.tar.xz -C /tmp
        ZIG_DIR=$(ls -d /tmp/zig-*/)
        export PATH="${ZIG_DIR}${PATH:+:${PATH}}"
        zig version
        # ziglang Python 模块——build.py 用 python3 -m ziglang cc 驱动
        pip3 install ziglang lief --break-system-packages --quiet
        python3 -c "import ziglang; print('ziglang OK')"

    - name: Build IPA
      run: |
        export IPHONEOS_SDK="/Applications/Xcode.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk"
        echo "SDK=$IPHONEOS_SDK"
        ls src/ | head -5
        python3 build.py
        ls -la VibeGo*.ipa

    - uses: actions/upload-artifact@v4
      with:
        name: vibego-ipa
        path: VibeGo*.ipa
        if-no-files-found: error
